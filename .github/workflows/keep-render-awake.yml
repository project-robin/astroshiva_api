name: Keep Render awake

on:
  schedule:
    # ponytail: external traffic is required because Render stops in-process timers.
    - cron: "2/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping health endpoint
        run: curl --fail --silent --show-error --max-time 90 --retry 2 --retry-all-errors https://astroshiva-api.onrender.com/health
